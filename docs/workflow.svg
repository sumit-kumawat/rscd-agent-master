<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#052140"/>
      <stop offset="100%" stop-color="#0a3058"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#052140">RSCD Manager — Workflow</text>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#64748b">How inventory checks and agent uninstall jobs run end-to-end</text>

  <!-- Layer 1: UI -->
  <rect x="260" y="78" width="400" height="56" rx="8" fill="url(#header)"/>
  <text x="460" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Web UI — RSCD Manager</text>
  <text x="460" y="120" text-anchor="middle" font-size="11" fill="#cbd5e1">Add / Import VMs · Check · New Job · Live logs</text>

  <line x1="460" y1="134" x2="460" y2="158" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Backend -->
  <rect x="220" y="160" width="480" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#052140">Node.js API + MongoDB</text>
  <text x="460" y="202" text-anchor="middle" font-size="11" fill="#64748b">VM inventory · Jobs · Activity logs · Background monitor (every 30s)</text>
  <text x="460" y="216" text-anchor="middle" font-size="10" fill="#94a3b8">REST API + Socket.IO real-time updates</text>

  <!-- Split arrows -->
  <line x1="320" y1="224" x2="320" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="224" x2="600" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Path A: Monitor / Check -->
  <rect x="60" y="254" width="360" height="28" rx="6" fill="#e8f0fe"/>
  <text x="240" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#052140">PATH A — Status Check (Monitor or Manual Check)</text>

  <rect x="80" y="296" width="320" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="240" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">1. Pick Windows VM from inventory</text>
  <text x="240" y="332" text-anchor="middle" font-size="10" fill="#64748b">Skip agents already marked Removed</text>

  <line x1="240" y1="340" x2="240" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="362" width="320" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="240" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">2. WMI connect to Windows host</text>
  <text x="240" y="398" text-anchor="middle" font-size="10" fill="#64748b">FQDN → IP fallback · credential retry</text>
  <text x="240" y="412" text-anchor="middle" font-size="10" fill="#64748b">(Administrator / rdsroot / rdsmon)</text>

  <line x1="240" y1="418" x2="240" y2="438" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="440" width="320" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="240" y="460" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">3. Probe agent on remote host</text>
  <text x="240" y="476" text-anchor="middle" font-size="10" fill="#64748b">Discover IP · RSCD service · version · install path</text>
  <text x="240" y="490" text-anchor="middle" font-size="10" fill="#64748b">Agent status: Active or Removed</text>

  <line x1="240" y1="496" x2="240" y2="516" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="518" width="320" height="40" rx="6" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="240" y="536" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">4. Save to MongoDB + push live UI update</text>
  <text x="240" y="550" text-anchor="middle" font-size="10" fill="#047857">Online/Offline · IP · Agent Active/Removed</text>

  <!-- Path B: Uninstall Job -->
  <rect x="500" y="254" width="360" height="28" rx="6" fill="#fef3c7"/>
  <text x="680" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">PATH B — Uninstall Job (single VM or bulk)</text>

  <rect x="520" y="296" width="320" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="680" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">1. Create job → select matching VMs</text>
  <text x="680" y="332" text-anchor="middle" font-size="10" fill="#64748b">Optional version filter · parallel pool (~12 VMs)</text>

  <line x1="680" y1="340" x2="680" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="362" width="320" height="68" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="680" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">2. Per VM — WMI uninstall steps</text>
  <text x="680" y="398" text-anchor="middle" font-size="10" fill="#64748b">Connect → detect agent → stop RSCD service</text>
  <text x="680" y="412" text-anchor="middle" font-size="10" fill="#64748b">MSI uninstall → registry cleanup → folder cleanup</text>
  <text x="680" y="426" text-anchor="middle" font-size="10" fill="#64748b">Verify agent removed on host</text>

  <line x1="680" y1="430" x2="680" y2="450" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="452" width="320" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="680" y="472" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">3. Update results in MongoDB</text>
  <text x="680" y="488" text-anchor="middle" font-size="10" fill="#64748b">agentStatus = Removed · job progress &amp; logs</text>
  <text x="680" y="502" text-anchor="middle" font-size="10" fill="#64748b">Success / Failed / Skipped counters</text>

  <line x1="680" y1="508" x2="680" y2="528" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="530" width="320" height="40" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="680" y="548" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">4. Job complete → Activity log + UI refresh</text>
  <text x="680" y="562" text-anchor="middle" font-size="10" fill="#b91c1c">Monitor skips Removed agents going forward</text>

  <!-- Windows VM target (center bottom) -->
  <line x1="240" y1="558" x2="460" y2="598" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="570" x2="460" y2="598" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="600" width="300" height="36" rx="8" fill="#052140"/>
  <text x="460" y="618" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Windows VM Fleet</text>
  <text x="460" y="632" text-anchor="middle" font-size="10" fill="#f55a4d">BMC BladeLogic RSCD Agent · WMI port 135/445</text>

  <!-- Legend -->
  <rect x="24" y="78" width="12" height="12" rx="2" fill="#e8f0fe" stroke="#93c5fd"/>
  <text x="42" y="88" font-size="10" fill="#64748b">Check flow</text>
  <rect x="24" y="96" width="12" height="12" rx="2" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="42" y="106" font-size="10" fill="#64748b">Uninstall flow</text>
</svg>
